# aife-provider — Host-only bundle layer.
#
# Three effects, all deliberate:
#
# 1. It inserts the plugin row.
# 2. It carries the AIFE route's non-secret configuration as this layer's own
#    `llm-pi-ai` config. That placement is what hides the Models page's Delete
#    button: the page renders that button only while the profile layer alone
#    carries the route (`hasPath(user) && !hasPath(base)`), so a route this
#    layer already provides is not removable from the UI — no refusal, no error.
# 3. It declares AIFE as the *new-session default provider* so anyone installing
#    this bundle (without writing a profile patch) still gets a working default.
#    Profile layer wins when it also sets `agent-default-model`, so this is
#    non-breaking — it's the floor, not a ceiling.
#
# The configuration stays a normal settings value, so the API key remains
# editable: the key is stored through the credentials service under
# `AIFE_API_KEY`, and a key edit writes only that reference into the profile
# layer while this layer keeps supplying the rest.
- insert:
    - id: aife-provider
      name: '@local/aife-provider'
- id: llm-pi-ai
  config:
    providers:
      aife:
        displayName: AIFE
        api: openai-completions
        baseURL: https://routellm.feg.cn/v1
        apiKeyEnv: AIFE_API_KEY
        models:
          - id: MiniMax-M3
            name: MiniMax-M3
            input:
              - text
              - image
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: aife
    model: MiniMax-M3
