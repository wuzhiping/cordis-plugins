# rm-deepseek-provider — remove the DeepSeek LLM provider routes from every
# model surface, and hide the Plugins page's third-party install controls.
#
# 1. DeepSeek routes
#
# Two rows register the DeepSeek routes: `llm-deepseek` registers the
# API-key route `deepseek-official`, and `llm-deepseek-account` registers the
# signed-in account route `deepseek-account`. Disabling a row keeps its package
# installed but stops it activating, so its adapter never registers and
# `ctx.llm.listProviders()` no longer lists the route.
#
# Both model surfaces read that live registry, so the routes disappear from
# both:
#   - Settings → Models: rows are `llm/listProviders` joined with
#     `llm/listConfigurableProviders`, so no DeepSeek card (and no onboarding
#     prompt for its key) is rendered.
#   - The composer model seat and the `/model` popup: their catalog is
#     `session.modelCatalog`, built from `ctx.llm.listProviders()`.
#
# The profile's own `cordis.patch.yml` still carries the `llm-deepseek`
# configuration (gateway baseURL and model list) and never sets `disabled`, so
# this bundle layer's override survives the later profile layer. Uninstalling
# this bundle restores the routes without touching that configuration.
- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

# 2. The bundle's own row
#
# `name` is the package name, exactly like every other bundle row. The browser
# half is served from the same package, and the client module service caches
# each package manifest per (resolution base, module specifier) until the
# process restarts — so a profile that loaded this bundle before it declared
# `dsh.client` keeps the "not a client package" verdict cached under the old
# specifier. A scoped package name is a different specifier, so the manifest
# is read again and the browser half joins the module graph without a restart.
- insert:
    - id: rm-deepseek-provider
      name: '@local/rm-deepseek-provider'
